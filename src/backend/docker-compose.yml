services:
  codekids-db:
    image: postgres:17
    container_name: codekids-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: codekids
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - codekids-postgres:/var/lib/postgresql/data

volumes:
  codekids-postgres:
