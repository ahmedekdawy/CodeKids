<div class="theme-switch" role="group" [attr.aria-label]="'theme.switch' | t">
  <button
    type="button"
    class="theme-btn"
    [class.active]="theme.theme() === 'light'"
    (click)="setTheme('light')"
    [attr.aria-label]="'theme.light' | t"
    [title]="'theme.light' | t"
  >
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
  </button>
  <button
    type="button"
    class="theme-btn"
    [class.active]="theme.theme() === 'dark'"
    (click)="setTheme('dark')"
    [attr.aria-label]="'theme.dark' | t"
    [title]="'theme.dark' | t"
  >
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
  </button>
</div>
