<div class="question-image-upload">
  @if (previewUrl(); as src) {
    <div class="preview-wrap">
      <img [src]="src" alt="" class="preview" />
      <button type="button" class="ghost-btn" (click)="clear()">{{ 'common.remove' | t }}</button>
    </div>
  }
  <label class="upload-label">
    {{ 'teacher.questionImage.upload' | t }}
    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" (change)="onFileSelected($event)" [disabled]="uploading()" />
  </label>
  @if (uploading()) {
    <span class="meta">{{ 'teacher.questionImage.uploading' | t }}</span>
  }
  @if (error()) {
    <span class="error">{{ error() }}</span>
  }
</div>
