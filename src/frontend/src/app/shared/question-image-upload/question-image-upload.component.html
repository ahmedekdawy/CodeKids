<div class="question-image-upload">
  @if (imageUrl()) {
    <div class="preview-wrap">
      <app-question-image-display [url]="imageUrl()" />
      <button type="button" class="ghost-btn" (click)="clear()">{{ 'common.remove' | t }}</button>
    </div>
  }
  <label class="upload-label">
    {{ 'teacher.questionImage.upload' | t }}
    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf" (change)="onFileSelected($event)" [disabled]="uploading()" />
  </label>
  @if (uploading()) {
    <span class="meta">{{ 'teacher.questionImage.uploading' | t }}</span>
  }
  @if (error()) {
    <span class="error">{{ error() }}</span>
  }
</div>
