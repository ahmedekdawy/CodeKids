<button
  type="button"
  class="icon-action-btn"
  [class.danger]="variant === 'danger' || kind === 'delete'"
  [class.play]="kind === 'play'"
  [class.login-as]="kind === 'loginAs'"
  [class.deactivate]="kind === 'deactivate'"
  [class.activate]="kind === 'activate'"
  [class.apply]="kind === 'apply'"
  [class.ghost]="variant === 'ghost'"
  [attr.aria-label]="ariaLabel()"
  [title]="ariaLabel()"
  [disabled]="disabled"
  (click)="action.emit()"
>
  @if (kind === 'edit') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M4 20h4l10.5-10.5a1.8 1.8 0 0 0 0-2.5L16.5 4.5a1.8 1.8 0 0 0-2.5 0L4 14.5V20z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  } @else if (kind === 'play') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M8 5.5v13l10-6.5-10-6.5z"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="0.5"
        stroke-linejoin="round"
      />
    </svg>
  } @else if (kind === 'apply') {
    <i class="fa-solid fa-filter" aria-hidden="true"></i>
  } @else if (kind === 'clear') {
    <span class="fa-filter-clear" aria-hidden="true">
      <i class="fa-solid fa-filter"></i>
      <i class="fa-solid fa-xmark"></i>
    </span>
  } @else if (kind === 'loginAs') {
    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
  } @else if (kind === 'deactivate') {
    <i class="fa-solid fa-user-slash" aria-hidden="true"></i>
  } @else if (kind === 'activate') {
    <i class="fa-solid fa-user-check" aria-hidden="true"></i>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m1 0v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7h12z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  }
</button>
