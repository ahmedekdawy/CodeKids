@if (auth.impersonator()) {
  <div class="impersonation-banner">
    <span>{{ 'auth.impersonating' | t: { name: auth.user()?.displayName || '' } }}</span>
    <button type="button" (click)="auth.stopImpersonating()">{{ 'auth.stopImpersonating' | t }}</button>
  </div>
}
@if (push.shouldAsk()) {
  <div class="update-banner push-banner" role="dialog" [attr.aria-label]="'pwa.pushAskTitle' | t">
    <span>🔔 {{ 'pwa.pushAsk' | t }}</span>
    <button type="button" [disabled]="push.busy()" (click)="push.enable()">{{ 'notifications.pushTurnOn' | t }}</button>
    <button type="button" class="update-later" (click)="push.snooze()">{{ 'pwa.pushNotNow' | t }}</button>
  </div>
}
<router-outlet />
<app-toast-host />
