<div class="panel-page">
  <h2>{{ 'teacher.quizzes.title' | t }}</h2>
  <p class="meta">{{ 'teacher.quizzes.subtitle' | t }}</p>

  @if (info()) {
    <p class="feedback ok">{{ info() }}</p>
  }
  @if (error()) {
    <p class="feedback">{{ error() }}</p>
  }

  <section class="block">
    <h3>{{ 'teacher.quizzes.create' | t }}</h3>
    <form class="meeting-form" (ngSubmit)="createQuiz()">
      <label>{{ 'common.title' | t }} <input [(ngModel)]="quizTitle" name="quizTitle" required /></label>
      <label>{{ 'common.description' | t }} <input [(ngModel)]="quizDescription" name="quizDescription" /></label>
      <label>
        {{ 'common.course' | t }}
        <select [(ngModel)]="quizCourseId" name="quizCourseId">
            @for (course of courses(); track course.id) {
            <option [value]="course.id">{{ courseLabel(course) }}</option>
          }
        </select>
      </label>
      <label>
        {{ 'common.classroom' | t }}
        <select [(ngModel)]="quizClassroomId" name="quizClassroomId">
          @for (room of classrooms(); track room.id) {
            <option [value]="room.id">{{ room.name }}</option>
          }
        </select>
      </label>
      <label>XP <input type="number" [(ngModel)]="quizXp" name="quizXp" /></label>
      <label>{{ 'teacher.quizzes.question' | t }} <input [(ngModel)]="quizPrompt" name="quizPrompt" required /></label>

      <div class="options-editor">
        <div class="options-head">
          <h4>{{ 'teacher.quizzes.options' | t }}</h4>
          <button type="button" class="ghost-btn" (click)="addOption()">{{ 'common.addOption' | t }}</button>
        </div>
        @for (opt of options; track $index; let i = $index) {
          <div class="option-row">
            <span class="option-key">{{ optionLabel(i) }}</span>
            <input [(ngModel)]="opt.text" [name]="'quizOpt-' + i" [placeholder]="'common.optionText' | t" (ngModelChange)="onOptionTextChange()" />
            <app-icon-action-button
              kind="delete"
              variant="ghost"
              [label]="'common.removeOption' | t"
              [disabled]="options.length <= 2"
              (action)="removeOption(i)"
            />
          </div>
        }

        <label>
          {{ 'common.correctAnswer' | t }}
          <select [(ngModel)]="quizCorrect" name="quizCorrect" required>
            <option value="">{{ 'common.selectCorrect' | t }}</option>
            @for (opt of filledOptions(); track opt.key) {
              <option [value]="opt.key">{{ opt.key }} — {{ opt.text }}</option>
            }
          </select>
        </label>
      </div>

      <button type="submit">{{ 'teacher.quizzes.create' | t }}</button>
    </form>
  </section>
</div>
