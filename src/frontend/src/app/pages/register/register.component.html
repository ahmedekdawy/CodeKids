<section class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-top">
      <p class="brand">CodeKids</p>
      <app-language-switcher />
    </div>
    <h1>{{ 'auth.register.title' | t }}</h1>
    <p class="supporting">{{ 'auth.register.subtitle' | t }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>{{ 'auth.displayName' | t }}</span>
        <input formControlName="displayName" [placeholder]="'auth.displayNamePlaceholder' | t" autocomplete="nickname" />
      </label>
      <label>
        <span>{{ 'auth.email' | t }}</span>
        <input formControlName="email" type="email" autocomplete="email" />
      </label>
      <label>
        <span>{{ 'auth.password' | t }}</span>
        <input formControlName="password" type="password" autocomplete="new-password" />
      </label>
      <label>
        <span>{{ 'auth.role' | t }}</span>
        <select formControlName="role">
          <option value="Student">{{ 'role.student' | t }}</option>
          <option value="Parent">{{ 'role.parent' | t }}</option>
        </select>
      </label>
      @if (form.controls.role.value === 'Student') {
        <label>
          <span>{{ 'auth.parentId' | t }}</span>
          <input formControlName="parentId" [placeholder]="'auth.parentIdPlaceholder' | t" />
        </label>
      }

      <button type="submit" [disabled]="loading() || form.invalid">{{ 'auth.createAccountBtn' | t }}</button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="auth-links">
      <a routerLink="/login">{{ 'auth.haveAccount' | t }}</a>
    </div>
  </div>

  <div class="auth-visual" aria-hidden="true">
    <div class="glow"></div>
    <div class="code-card">
      <span>coins = 5</span>
      <span>print(coins)</span>
    </div>
  </div>
</section>
