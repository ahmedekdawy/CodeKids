<section class="auth-shell">
  <div class="auth-panel">
    <p class="brand">CodeKids</p>
    <h1>Join the coding crew.</h1>
    <p class="supporting">Create a student or parent account. Teachers are created by Super Admin.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Display name</span>
        <input formControlName="displayName" placeholder="Ava" />
      </label>
      <label>
        <span>Email</span>
        <input formControlName="email" type="email" />
      </label>
      <label>
        <span>Password</span>
        <input formControlName="password" type="password" />
      </label>
      <label>
        <span>Role</span>
        <select formControlName="role">
          <option value="Student">Student</option>
          <option value="Parent">Parent</option>
        </select>
      </label>
      @if (form.controls.role.value === 'Student') {
        <label>
          <span>Parent ID (optional)</span>
          <input formControlName="parentId" placeholder="Paste parent account GUID" />
        </label>
      }

      <button type="submit" [disabled]="loading() || form.invalid">Create account</button>
    </form>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <a routerLink="/login">Already have an account?</a>
  </div>
  <div class="auth-visual" aria-hidden="true">
    <div class="glow"></div>
    <div class="code-card">
      <span>coins = 5</span>
      <span>print(coins)</span>
    </div>
  </div>
</section>
