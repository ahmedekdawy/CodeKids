<section class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-top">
      <app-site-brand />
      <app-language-switcher />
    </div>
    <h1>{{ 'auth.forgot.title' | t }}</h1>
    <p class="supporting">{{ 'auth.forgot.subtitle' | t }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>{{ 'auth.loginOrMobile' | t }}</span>
        <input formControlName="login" type="text" autocomplete="username" />
      </label>

      <button type="submit" [disabled]="loading() || form.invalid">{{ 'auth.forgot.submit' | t }}</button>
    </form>

    @if (success()) {
      <p class="hint">{{ success() }}</p>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="auth-links">
      <a routerLink="/login">{{ 'auth.forgot.backToLogin' | t }}</a>
    </div>
  </div>

  <div class="auth-visual" [class.has-banner]="!!brand.bannerUrl()" aria-hidden="true">
    @if (brand.bannerUrl(); as banner) {
      <img class="auth-banner-img" [src]="banner" [alt]="brand.siteName()" />
    } @else {
      <div class="glow"></div>
      <div class="code-card">
        <span>RESET LINK</span>
        <span>CHECK YOUR INBOX</span>
      </div>
    }
  </div>
</section>
