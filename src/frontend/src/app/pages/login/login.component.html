<section class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-top">
      <app-site-brand />
      <app-language-switcher />
    </div>
    <h1>{{ 'auth.login.title' | t }}</h1>
    <p class="supporting">{{ 'auth.login.subtitle' | t }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>{{ 'auth.loginOrMobile' | t }}</span>
        <input formControlName="login" type="text" placeholder="student@codekids.local" autocomplete="username" />
      </label>
      <label>
        <span>{{ 'auth.password' | t }}</span>
        <input formControlName="password" type="password" [placeholder]="'auth.passwordPlaceholder' | t" autocomplete="current-password" />
      </label>

      <button type="submit" [disabled]="loading() || form.invalid">{{ 'auth.signIn' | t }}</button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="hint">{{ 'auth.demoStudent' | t }}</p>
    <p class="hint">{{ 'auth.demoOthers' | t }}</p>

    <div class="auth-links">
      <a routerLink="/register">{{ 'auth.createAccount' | t }}</a>
    </div>
  </div>

  <div class="auth-visual" [class.has-banner]="!!brand.bannerUrl()" aria-hidden="true">
    @if (brand.bannerUrl(); as banner) {
      <img class="auth-banner-img" [src]="banner" [alt]="brand.siteName()" />
    } @else {
      <div class="glow"></div>
      <div class="code-card">
        <span>LOOP 3 FORWARD</span>
        <span>IF asteroid THEN dodge</span>
      </div>
    }
  </div>
</section>
