<div class="shell" [class.collapsed]="collapsed()" [class.menu-open]="menuOpen()">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        @if (brand.logoUrl(); as logo) {
          <img class="brand-logo" [src]="logo" [alt]="brand.siteName()" />
        }
        <p class="brand">{{ collapsed() ? brand.shortName() : brand.siteName() }}</p>
        @if (!collapsed()) {
          <strong>{{ titleKey | t }}</strong>
          <small>{{ subtitleKey | t }}</small>
        }
      </div>
      <div class="sidebar-tools">
        <button type="button" class="collapse-btn" (click)="toggle()" [title]="collapseTitle()" [attr.aria-label]="collapseTitle()">
          <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <app-language-switcher />
      </div>
    </div>

    <div class="nav-wrap" [class.open]="menuOpen()">
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="'common.menu' | t">
        <span class="menu-toggle-icon" aria-hidden="true">☰</span>
        <span>{{ 'common.menu' | t }}</span>
      </button>
      <nav class="side-nav" (click)="onNavClick($event)">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [title]="item.labelKey | t">
            <span class="nav-icon">{{ iconFor(item) }}</span>
            <span class="nav-label">{{ item.labelKey | t }}</span>
          </a>
        }
      </nav>
    </div>

    <button type="button" class="logout" (click)="auth.logout()" [title]="'common.signOut' | t">
      <span class="logout-icon" aria-hidden="true">⎋</span>
      <span class="logout-label">{{ 'common.signOut' | t }}</span>
    </button>
  </aside>

  <main class="shell-main">
    <ng-content />
    <app-api-busy-indicator />
  </main>
</div>
