<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <p class="brand">{{ collapsed() ? 'CK' : 'CodeKids' }}</p>
        @if (!collapsed()) {
          <strong>{{ titleKey | t }}</strong>
          <small>{{ subtitleKey | t }}</small>
        }
      </div>
      <div class="sidebar-tools">
        <app-language-switcher />
        <button type="button" class="collapse-btn" (click)="toggle()" [title]="collapseTitle()">
          {{ collapsed() ? '»' : '«' }}
        </button>
      </div>
    </div>

    <nav class="side-nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [title]="item.labelKey | t">
          <span class="nav-icon">{{ iconFor(item) }}</span>
          @if (!collapsed()) {
            <span class="nav-label">{{ item.labelKey | t }}</span>
          }
        </a>
      }
    </nav>

    <button type="button" class="logout" (click)="auth.logout()" [title]="'common.signOut' | t">
      @if (collapsed()) {
        ⎋
      } @else {
        {{ 'common.signOut' | t }}
      }
    </button>
  </aside>

  <main class="shell-main">
    <ng-content />
  </main>
</div>
