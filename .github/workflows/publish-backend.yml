name: Publish Backend

on:
  push:
    branches: [master, main]
    paths:
      - "src/backend/**"
      - ".github/workflows/publish-backend.yml"
      - ".github/scripts/ftp-app-offline.py"
  workflow_dispatch:

concurrency:
  group: publish-backend
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CodeKids.Api/CodeKids.Api.csproj

      - name: Publish
        run: >
          dotnet publish CodeKids.Api/CodeKids.Api.csproj
          -c Release
          -o "${{ github.workspace }}/artifacts/backend"
          --no-restore

      - name: Remove local-only config from publish output
        shell: bash
        run: |
          rm -f "${{ github.workspace }}/artifacts/backend/appsettings.Development.json"
          # Keep production appsettings on the server; do not overwrite from CI.
          rm -f "${{ github.workspace }}/artifacts/backend/appsettings.json"

      - name: Take site offline
        env:
          FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BACKEND_FTP_SERVER_DIR }}
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/ftp-app-offline.py put

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BACKEND_FTP_SERVER }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          local-dir: ./artifacts/backend/
          server-dir: ${{ secrets.BACKEND_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.json
            **/appsettings.Development.json
            **/App_Data/**
            **/app_offline.htm

      - name: Bring site online
        if: always()
        env:
          FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BACKEND_FTP_SERVER_DIR }}
        working-directory: ${{ github.workspace }}
        run: python .github/scripts/ftp-app-offline.py delete
