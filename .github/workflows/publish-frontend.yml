name: Publish Frontend

on:
  push:
    branches: [master, main, multitenant]
    paths:
      - "src/frontend/**"
      - "!src/frontend/dist/**"
      - "!src/frontend/.angular/**"
      - ".github/workflows/publish-frontend.yml"
  workflow_dispatch:

concurrency:
  group: publish-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'multitenant' && 'multitenant' || 'production' }}
    env:
      FTP_SERVER: ${{ github.ref_name == 'multitenant' && secrets.MULTITENANT_FRONTEND_FTP_SERVER || secrets.FRONTEND_FTP_SERVER }}
      FTP_USERNAME: ${{ github.ref_name == 'multitenant' && secrets.MULTITENANT_FRONTEND_FTP_USERNAME || secrets.FRONTEND_FTP_USERNAME }}
      FTP_PASSWORD: ${{ github.ref_name == 'multitenant' && secrets.MULTITENANT_FRONTEND_FTP_PASSWORD || secrets.FRONTEND_FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ github.ref_name == 'multitenant' && secrets.MULTITENANT_FRONTEND_FTP_SERVER_DIR || secrets.FRONTEND_FTP_SERVER_DIR }}
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Point schoolacadmy build at its own API
        if: github.ref_name == 'multitenant'
        env:
          API_BASE_URL: ${{ secrets.MULTITENANT_API_BASE_URL }}
          APP_BASE_URL: ${{ secrets.MULTITENANT_APP_BASE_URL }}
        run: |
          set -euo pipefail
          APP_BASE_URL="${APP_BASE_URL:-http://schoolacadmy.runasp.net}"
          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::Set repository secret MULTITENANT_API_BASE_URL to the new backend, for example http://your-api.runasp.net/api. The schoolacadmy site is currently built against http://abakera.runasp.net, which does not allow this origin."
            exit 1
          fi
          API_BASE_URL="${API_BASE_URL%/}"
          sed -i "s|__API_BASE_URL__|${API_BASE_URL}|g" src/environments/environment.multitenant.ts
          sed -i "s|__APP_BASE_URL__|${APP_BASE_URL}|g" src/environments/environment.multitenant.ts

      - name: Build production
        run: npm run build -- --configuration=${{ github.ref_name == 'multitenant' && 'multitenant' || 'production' }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./src/frontend/dist/codekids-frontend/browser/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
